# Generate the Xcode project with:  cd ios && xcodegen   (brew install xcodegen)
# The generated TappyTabs.xcodeproj is committed too, so teammates can just open it.
name: TappyTabs
options:
  bundleIdPrefix: com.tappytabs
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
packages:
  ConvexMobile:
    url: https://github.com/get-convex/convex-swift
    from: 0.8.1
targets:
  TappyTabs:
    type: application
    platform: iOS
    sources:
      - path: TappyTabs
    dependencies:
      - package: ConvexMobile
    configFiles:
      Debug: Config/TappyTabs.xcconfig
      Release: Config/TappyTabs.xcconfig
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: TappyTabs/Resources/Info.plist
      properties:
        CFBundleDisplayName: TappyTabs
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        NSNearbyInteractionUsageDescription: TappyTabs measures the distance to the restaurant phone so you can tap to join a table.
        NSLocalNetworkUsageDescription: TappyTabs finds the restaurant phone nearby to check you in.
        NSCameraUsageDescription: Scan the table's QR code if tapping doesn't work.
        NSBonjourServices: [_tappytabs._tcp, _tappytabs._udp]
        # Dev only: lets phones reach a Convex backend on the LAN over http. Remove for anything real.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.tappytabs.join
            CFBundleURLSchemes: [tappytabs]
  TappyTabsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TappyTabsTests]
    dependencies:
      - target: TappyTabs
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TappyTabs:
    build:
      targets:
        TappyTabs: all
        TappyTabsTests: [test]
    test:
      targets: [TappyTabsTests]
